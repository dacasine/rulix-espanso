  - trigger: "rsgeacff"
    label: "rs/GE D 1 45 - ACFF/GE"
    markdown: "Accord entre le Conseil fédéral suisse et le Gouvernement de la République française sur la compensation financière relative aux frontaliers travaillant à Genève (ci-après ACFF/GE, [rs/GE D 1 45](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_d1_45.htm))"

  - trigger: "rsgeaci"
    label: "rs/GE D 1 40 - ACI/GE"
    markdown: "Accord-cadre pour la collaboration intercantonale assortie d’une compensation des charges (ci-après ACI/GE, [rs/GE D 1 40](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_d1_40.htm))"

  - trigger: "rsgeacugech"
    label: "rs/GE A 1 01 - AcU-GE-CH/GE"
    markdown: "Acte d’union de la République de Genève à la Confédération suisse (ci-après AcU-GE-CH/GE, [rs/GE A 1 01](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_a1_01.htm))"

  - trigger: "rsgeaepr"
    label: "rs/GE C 2 06 - AEPr/GE"
    markdown: "Accord intercantonal sur les contributions dans le domaine de la formation professionnelle initiale (accord sur les écoles professionnelles) (ci-après AEPr/GE, [rs/GE C 2 06](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_c2_06.htm))"

  - trigger: "rsgeaes"
    label: "rs/GE C 1 36 - AES/GE"
    markdown: "Accord intercantonal sur les contributions dans le domaine des écoles supérieures (ci-après AES/GE, [rs/GE C 1 36](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_c1_36.htm))"

  - trigger: "rsgeahes"
    label: "rs/GE C 1 21 - AHES/GE"
    markdown: "Accord intercantonal sur les Hautes écoles spécialisées à partir de 2005 (ci-après AHES/GE, [rs/GE C 1 21](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_c1_21.htm))"

  - trigger: "rsgeaicps"
    label: "rs/GE C 1 08 - AICPS/GE"
    markdown: "Accord intercantonal sur la collaboration dans le domaine de la pédagogie spécialisée (ci-après AICPS/GE, [rs/GE C 1 08](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_c1_08.htm))"

  - trigger: "rsgeaicrl"
    label: "rs/GE L 2 15 - AICRL/GE"
    markdown: "Acte intercantonal concernant la correction et la régularisation de l’écoulement des eaux du Léman entre les cantons de Genève, de Vaud et du Valais (ci-après AICRL/GE, [rs/GE L 2 15](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_l2_15.htm))"

  - trigger: "rsgeaietc"
    label: "rs/GE L 5 07 - AIETC/GE"
    markdown: "Accord intercantonal sur l’élimination des entraves techniques au commerce (ci-après AIETC/GE, [rs/GE L 5 07](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_l5_07.htm))"

  - trigger: "rsgeaimp"
    label: "rs/GE L 6 05 - AIMP/GE"
    markdown: "Accord intercantonal sur les marchés publics (ci-après AIMP/GE, [rs/GE L 6 05](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_l6_05.htm))"

  - trigger: "rsgeaird"
    label: "rs/GE C 1 15 - AIRD/GE"
    markdown: "Accord intercantonal sur la reconnaissance des diplômes de fin d’études (ci-après AIRD/GE, [rs/GE C 1 15](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_c1_15.htm))"

  - trigger: "rsgeaiu"
    label: "rs/GE C 1 32 - AIU/GE"
    markdown: "Accord intercantonal sur les contributions aux coûts de formation des hautes écoles universitaires (accord intercantonal universitaire) (ci-après AIU/GE, [rs/GE C 1 32](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_c1_32.htm))"

  - trigger: "rsgeakct"
    label: "rs/GE A 1 11 - AKCT/GE"
    markdown: "Accord de Karlsruhe sur la coopération transfrontalière entre les collectivités territoriales et organismes publics locaux (ci-après AKCT/GE, [rs/GE A 1 11](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_a1_11.htm))"

  - trigger: "rsgearca2026"
    label: "rs/GE D 3 05.30 - ArCA-2026/GE"
    markdown: "Arrêté approuvant le nombre des centimes additionnels à percevoir pour l’année 2026 par les communes du canton de Genève, à l’exception de la commune de Vernier (ci-après ArCA-2026/GE, [rs/GE D 3 05.30](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_d3_05p30.htm))"

  - trigger: "rsgearcap"
    label: "rs/GE I 4 45.07 - ArCAP/GE"
    markdown: "Arrêté déterminant les catégories de logements où sévit la pénurie en vue de l’application de l’article 207 de la loi d’application du code civil suisse et d’autres lois fédérales en matière civile (ci-après ArCAP/GE, [rs/GE I 4 45.07](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_i4_45p07.htm))"

  - trigger: "rsgearpmae"
    label: "rs/GE L 2 30.03 - ArPMAE/GE"
    markdown: "Arrêté fixant le prix moyen du mégajoule par agent énergétique (ci-après ArPMAE/GE, [rs/GE L 2 30.03](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_l2_30p03.htm))"

  - trigger: "rsgearrpfol"
    label: "rs/GE L 1 35.06 - ArRPFOL/GE"
    markdown: "Arrêté fixant les rendements admissibles dans les plans financiers des opérations de logement soumis à la loi générale sur les zones de développement, du 29 juin 1957, à la loi générale sur le logement et la protection des locataires, du 4 décembre 1977, ou à la loi pour la construction de logements d'utilité publique, du 24 mai 2007 (ci-après ArRPFOL/GE, [rs/GE L 1 35.06](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_l1_35p06.htm))"

  - trigger: "rsgearsmc2026"
    label: "rs/GE J 1 05.03 - ArSMC-2026/GE"
    markdown: "Arrêté relatif au salaire minimum cantonal pour l’année 2026 (ci-après ArSMC-2026/GE, [rs/GE J 1 05.03](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_j1_05p03.htm))"

  - trigger: "rsgebcds"
    label: "rs/GE D 3 25.09 - BCDS/GE"
    markdown: "Barème pour le calcul des droits de succession (ci-après BCDS/GE, [rs/GE D 3 25.09](https://silgeneve.ch/legis/program/books/rsg/htm/rsg_d3_25p09.htm))"

  - trigger: "rsgecbe"
